<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faizatu | Personal Journal & Goals</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f6;
      --card-bg: #ffffff;
      --text-main: #1f2421;
      --text-muted: #6b7280;
      --accent: #2d6a4f;
      --accent-soft: #e8f5e9;
      --border: #e5e7eb;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .profile-title h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 600;
    }

    .profile-title p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    .nav-tabs {
      display: flex;
      gap: 0.5rem;
    }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--text-main);
      color: #fff;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
    }

    .section-header h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
    }

    .add-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .input-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }

    input[type="text"], textarea, select {
      flex: 1;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.95rem;
      background: #fafafa;
      outline: none;
    }

    .btn-main {
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .photo-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .photo-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      background-color: #f3f4f6;
    }

    .photo-info {
      padding: 1.2rem;
    }

    .photo-info h4 {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
    }

    .photo-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .memory-item {
      background: var(--card-bg);
      border-left: 4px solid var(--accent);
      padding: 1.2rem 1.5rem;
      border-radius: 0 var(--radius) var(--radius) 0;
      border-top: 1px solid var(--border);
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
    }

    .memory-date {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
    }

    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }

    .goal-card {
      background: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      gap: 0.75rem;
    }

    .goal-content.completed p {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .goal-tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .file-picker-btn {
      display: inline-flex;
      align-items: center;
      padding: 0.75rem 1.25rem;
      background: #f3f4f6;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="profile-title">
        <h1>Faizatu's Space</h1>
        <p>Snapshots, memories, and personal milestones.</p>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="filterTab('all', this)">All</button>
        <button class="tab-btn" onclick="filterTab('photos', this)">Photos</button>
        <button class="tab-btn" onclick="filterTab('memories', this)">Memories</button>
        <button class="tab-btn" onclick="filterTab('goals', this)">Goals</button>
      </nav>
    </header>

    <!-- PHOTOS -->
    <section id="photos-sec">
      <div class="section-header">
        <h2>Photo Journal</h2>
        <button class="btn-danger" onclick="clearAllPhotos()">Wipe Broken Photos</button>
      </div>

      <div class="add-box">
        <div class="input-row">
          <label class="file-picker-btn">
            📸 Select Image
            <input type="file" id="file-input" accept="image/*" style="display:none;" onchange="handleFileSelect(this)">
          </label>
          <span id="chosen-file-label" style="font-size:0.85rem; color:var(--text-muted);">No image selected</span>
          <input type="text" id="photo-caption" placeholder="Add a caption..." />
        </div>
        <div id="status-msg" style="font-size:0.85rem; font-weight:600; color:var(--accent);"></div>
        <button class="btn-main" id="upload-btn" onclick="uploadPhoto()">Add to Gallery</button>
      </div>

      <div class="photo-grid" id="photo-container"></div>
    </section>

    <!-- MEMORIES -->
    <section id="memories-sec">
      <div class="section-header">
        <h2>Memories</h2>
      </div>
      <div class="add-box">
        <div class="input-row">
          <input type="text" id="mem-date" placeholder="Date / Term" style="max-width:200px;" />
          <input type="text" id="mem-title" placeholder="Title" />
        </div>
        <textarea id="mem-text" rows="2" placeholder="Describe the memory..."></textarea>
        <button class="btn-main" onclick="addMemory()">Save Memory</button>
      </div>
      <div class="memory-list" id="memories-container"></div>
    </section>

    <!-- GOALS -->
    <section id="goals-sec">
      <div class="section-header">
        <h2>Goals & Next Steps</h2>
      </div>
      <div class="add-box">
        <div class="input-row">
          <select id="goal-category" style="max-width:180px;">
            <option value="Academic">Academic</option>
            <option value="Creative">Creative</option>
            <option value="Career">Career</option>
            <option value="Personal">Personal</option>
          </select>
          <input type="text" id="goal-desc" placeholder="What are you striving for?" />
        </div>
        <button class="btn-main" onclick="addGoal()">Add Goal</button>
      </div>
      <div class="goals-grid" id="goals-container"></div>
    </section>
  </div>

  <script>
    // --- IndexedDB Configuration (No storage size limits) ---
    const DB_NAME = "FaizatuSpaceDB";
    const DB_VERSION = 1;
    let db;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("photos")) d.createObjectStore("photos", { keyPath: "id" });
          if (!d.objectStoreNames.contains("memories")) d.createObjectStore("memories", { keyPath: "id" });
          if (!d.objectStoreNames.contains("goals")) d.createObjectStore("goals", { keyPath: "id" });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    // Clean old broken localStorage cache from previous runs
    localStorage.removeItem("faizatu_personal_space_data");
    localStorage.removeItem("faizatu_personal_space_data_v2");

    // Generic DB helper
    function dbGetAll(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
    }

    function dbPut(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => resolve();
      });
    }

    function dbDelete(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    function dbClear(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => resolve();
      });
    }

    // --- Photo Management ---
    let selectedFile = null;

    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('chosen-file-label').textContent = selectedFile.name;
      }
    }

    async function uploadPhoto() {
      const caption = document.getElementById('photo-caption').value.trim() || 'Untitled';
      const status = document.getElementById('status-msg');

      if (!selectedFile) {
        alert("Please select a photo first!");
        return;
      }

      status.textContent = "Processing image...";

      try {
        // High-compatibility image decoding using HTML Canvas
        const bitmap = await createImageBitmap(selectedFile);
        const canvas = document.createElement('canvas');
        
        // Scale down high-res phone pictures smoothly
        const maxDimension = 1200;
        let width = bitmap.width;
        let height = bitmap.height;

        if (width > height && width > maxDimension) {
          height = Math.round((height * maxDimension) / width);
          width = maxDimension;
        } else if (height > maxDimension) {
          width = Math.round((width * maxDimension) / height);
          height = maxDimension;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(bitmap, 0, 0, width, height);

        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

        await dbPut("photos", {
          id: Date.now(),
          src: dataUrl,
          caption: caption,
          date: new Date().toLocaleDateString()
        });

        selectedFile = null;
        document.getElementById('file-input').value = "";
        document.getElementById('chosen-file-label').textContent = "No image selected";
        document.getElementById('photo-caption').value = "";
        status.textContent = "";

        loadPhotos();
      } catch (err) {
        console.error(err);
        status.textContent = "";
        alert("Could not load this file. Please make sure it is an image (JPG, PNG, or standard camera photo).");
      }
    }

    async function loadPhotos() {
      const list = await dbGetAll("photos");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('photo-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem;">No photos yet. Click 'Select Image' above to post your first picture!</p>`;
        return;
      }

      container.innerHTML = list.map(item => `
        <div class="photo-card">
          <button class="delete-btn" onclick="removePhoto(${item.id})">✕</button>
          <img src="${item.src}" alt="${item.caption}" />
          <div class="photo-info">
            <h4>${item.caption}</h4>
            <p>${item.date}</p>
          </div>
        </div>
      `).join('');
    }

    async function removePhoto(id) {
      await dbDelete("photos", id);
      loadPhotos();
    }

    async function clearAllPhotos() {
      if (confirm("This will wipe out any broken or stuck photos so you can start fresh. Continue?")) {
        await dbClear("photos");
        loadPhotos();
      }
    }

    // --- Memories Management ---
    async function addMemory() {
      const date = document.getElementById('mem-date').value.trim() || new Date().toLocaleDateString();
      const title = document.getElementById('mem-title').value.trim();
      const text = document.getElementById('mem-text').value.trim();

      if (!title || !text) {
        alert("Please enter a title and text.");
        return;
      }

      await dbPut("memories", { id: Date.now(), date, title, text });
      document.getElementById('mem-date').value = "";
      document.getElementById('mem-title').value = "";
      document.getElementById('mem-text').value = "";
      loadMemories();
    }

    async function loadMemories() {
      const list = await dbGetAll("memories");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('memories-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem;">No memories logged yet.</p>`;
        return;
      }

      container.innerHTML = list.map(m => `
        <div class="memory-item">
          <div>
            <div class="memory-date">${m.date}</div>
            <h4 style="margin-bottom:0.2rem;">${m.title}</h4>
            <p style="color:var(--text-muted); font-size:0.95rem;">${m.text}</p>
          </div>
          <button onclick="removeMemory(${m.id})" style="border:none; background:none; cursor:pointer; color:#9ca3af; font-size:1.1rem;">✕</button>
        </div>
      `).join('');
    }

    async function removeMemory(id) {
      await dbDelete("memories", id);
      loadMemories();
    }

    // --- Goals Management ---
    async function addGoal() {
      const cat = document.getElementById('goal-category').value;
      const text = document.getElementById('goal-desc').value.trim();

      if (!text) {
        alert("Please write your goal.");
        return;
      }

      await dbPut("goals", { id: Date.now(), category: cat, text, done: false });
      document.getElementById('goal-desc').value = "";
      loadGoals();
    }

    async function toggleGoal(id, currentDone) {
      const list = await dbGetAll("goals");
      const goal = list.find(g => g.id === id);
      if (goal) {
        goal.done = !currentDone;
        await dbPut("goals", goal);
        loadGoals();
      }
    }

    async function removeGoal(id) {
      await dbDelete("goals", id);
      loadGoals();
    }

    async function loadGoals() {
      const list = await dbGetAll("goals");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('goals-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem;">No goals added yet.</p>`;
        return;
      }

      container.innerHTML = list.map(g => `
        <div class="goal-card">
          <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleGoal(${g.id}, ${g.done})">
          <div class="goal-content ${g.done ? 'completed' : ''}">
            <span class="goal-tag">${g.category}</span>
            <p style="font-weight: 500; font-size: 0.95rem;">${g.text}</p>
          </div>
          <button onclick="removeGoal(${g.id})" style="border:none; background:none; cursor:pointer; color:#9ca3af; font-size:1rem;">✕</button>
        </div>
      `).join('');
    }

    function filterTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('photos-sec').style.display = (tab === 'all' || tab === 'photos') ? 'block' : 'none';
      document.getElementById('memories-sec').style.display = (tab === 'all' || tab === 'memories') ? 'block' : 'none';
      document.getElementById('goals-sec').style.display = (tab === 'all' || tab === 'goals') ? 'block' : 'none';
    }

    // Initialize Database
    openDatabase().then(() => {
      loadPhotos();
      loadMemories();
      loadGoals();
    });
  </script>
</body>
</html>
