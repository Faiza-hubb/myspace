<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Faizatu's Cozy Corner 🌸✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Automatic iPhone HEIC photo converter -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>

  <!-- iPhone Web App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Faizatu" />
  <meta name="theme-color" content="#fff0f5" />
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/cherry-blossom.png" />

  <style>
    :root {
      --bg: #fff0f5;
      --card-bg: rgba(255, 255, 255, 0.95);
      --pink-soft: #ffe5ec;
      --pink-primary: #ff758f;
      --pink-hover: #ff4d6d;
      --pink-deep: #a4133c;
      --text-main: #4a2835;
      --text-muted: #8d6b77;
      --radius: 24px;
      --shadow: 0 10px 25px rgba(255, 117, 143, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
      background: linear-gradient(135deg, #fff0f5 0%, #fff5f8 50%, #fdeff4 100%);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-main);
      line-height: 1.6;
    }

    body {
      /* Safe padding for iPhone notch / Dynamic Island and home bar */
      padding: max(1.2rem, env(safe-area-inset-top)) 1rem calc(2rem + env(safe-area-inset-bottom)) 1rem;
      min-height: 100vh;
    }

    .container {
      max-width: 680px; /* Comfortable reading and feed width for phones and desktops */
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* Cozy Top Header */
    header {
      background: var(--card-bg);
      border-radius: 28px;
      padding: 1.5rem;
      border: 3px solid #ffccd5;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .profile-title h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.1rem;
      color: var(--pink-hover);
      letter-spacing: -0.5px;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }

    .profile-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* Scrollable Tabs */
    .nav-tabs {
      display: flex;
      gap: 0.5rem;
      background: #fff;
      padding: 0.4rem;
      border-radius: 9999px;
      border: 2px solid #ffccd5;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .nav-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: none;
      padding: 0.55rem 1.2rem;
      border-radius: 9999px;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--pink-primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 117, 143, 0.35);
    }

    /* Section Headers */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding: 0 0.4rem;
    }

    .section-header h2 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: var(--pink-deep);
    }

    /* Form Boxes */
    .add-box {
      background: var(--card-bg);
      border: 2px solid #ffccd5;
      border-radius: var(--radius);
      padding: 1.4rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.8rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .add-box h4 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: var(--pink-hover);
    }

    .input-row {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    @media (min-width: 580px) {
      .input-row { flex-direction: row; }
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 0.8rem 1.1rem;
      border-radius: 16px;
      border: 2px solid #ffe5ec;
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      background: #ffffff;
      outline: none;
      color: var(--text-main);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--pink-primary);
    }

    .btn-cute {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: #fff;
      padding: 0.8rem 1.6rem;
      border-radius: 9999px;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(255, 77, 109, 0.3);
      width: 100%;
      text-align: center;
    }

    @media (min-width: 580px) {
      .btn-cute { width: auto; align-self: flex-start; }
    }

    .file-picker-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1.3rem;
      background: #fff;
      border: 2px solid #ffccd5;
      border-radius: 9999px;
      font-family: 'Fredoka', sans-serif;
      color: var(--pink-hover);
      cursor: pointer;
      font-size: 0.92rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .btn-clear {
      background: #fff0f3;
      border: 1.5px solid #ffccd5;
      color: var(--pink-deep);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.8rem;
      padding: 0.4rem 0.9rem;
      border-radius: 9999px;
      cursor: pointer;
    }

    /* Original Photo/Video Cards */
    .media-list {
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
      width: 100%;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 24px;
      overflow: hidden;
      border: 2.5px solid #ffe5ec;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Picture container: Never cuts off heads or tops */
    .media-frame {
      width: 100%;
      background: #1e1518;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 260px;
    }

    .photo-card img {
      width: 100%;
      height: auto;
      max-height: 550px;
      object-fit: contain;
      display: block;
    }

    .photo-card video {
      width: 100%;
      max-height: 550px;
      display: block;
      background: #000;
    }

    /* Caption & details naturally below */
    .photo-info {
      padding: 1.1rem 1.4rem;
      background: #fff;
    }

    .photo-info h4 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: var(--pink-deep);
      margin-bottom: 0.2rem;
    }

    .photo-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .delete-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      color: var(--pink-deep);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* Memories */
    .memory-list {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .memory-item {
      background: #ffffff;
      border-left: 5px solid var(--pink-primary);
      padding: 1.2rem 1.4rem;
      border-radius: 0 22px 22px 0;
      border-top: 1.5px solid #ffe5ec;
      border-right: 1.5px solid #ffe5ec;
      border-bottom: 1.5px solid #ffe5ec;
      box-shadow: var(--shadow);
      display: flex;
      justify-content: space-between;
      gap: 1rem;
    }

    /* Goals */
    .goals-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .goal-card {
      background: #ffffff;
      padding: 1.2rem;
      border-radius: 20px;
      border: 1.5px solid #ffe5ec;
      box-shadow: var(--shadow);
      display: flex;
      gap: 0.9rem;
      align-items: flex-start;
    }

    .goal-card input[type="checkbox"] {
      margin-top: 0.2rem;
      width: 20px;
      height: 20px;
      accent-color: var(--pink-primary);
      cursor: pointer;
    }

    .goal-tag {
      display: inline-block;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      padding: 0.2rem 0.65rem;
      border-radius: 20px;
      background: #ffe5ec;
      color: var(--pink-deep);
      font-weight: 600;
      margin-bottom: 0.3rem;
    }

    .completed p {
      text-decoration: line-through;
      color: #b5a3ab;
    }

    footer {
      text-align: center;
      margin-top: 1.5rem;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      color: var(--pink-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="profile-title">
        <h1>Faizatu's Space 🌸</h1>
        <p>A little pink corner for my snapshots, dreams & thoughts ✨</p>
      </div>
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="filterTab('all', this)">All 🎀</button>
        <button class="tab-btn" onclick="filterTab('photos', this)">Photos & Clips 📸</button>
        <button class="tab-btn" onclick="filterTab('memories', this)">Memories 💌</button>
        <button class="tab-btn" onclick="filterTab('goals', this)">Goals 🌷</button>
      </nav>
    </header>

    <!-- SECTION 1: PHOTOS & VIDEOS -->
    <section id="photos-sec">
      <div class="section-header">
        <h2>Photo & Video Journal 📸</h2>
        <button class="btn-clear" onclick="clearAllMedia()">Clear All</button>
      </div>

      <div class="add-box">
        <h4>Post a New Picture or Video 🌷</h4>
        <div class="input-row">
          <label class="file-picker-btn">
            🎀 Pick Media
            <input type="file" id="media-input" accept="image/*,video/*,.heic,.HEIC,.mov,.mp4" style="display:none;" onchange="handleSelect(this)">
          </label>
          <span id="file-label" style="font-size:0.88rem; font-weight:600; color:var(--text-muted); align-self:center;">No file chosen</span>
          <input type="text" id="caption-input" placeholder="Write a cute caption..." />
        </div>
        <div id="status-msg" style="font-size:0.85rem; font-weight:700; color:var(--pink-hover);"></div>
        <button class="btn-cute" onclick="saveMedia()">Add to Gallery ✨</button>
      </div>

      <div class="media-list" id="media-container"></div>
    </section>

    <!-- SECTION 2: MEMORIES -->
    <section id="memories-sec">
      <div class="section-header">
        <h2>Cherished Memories 💌</h2>
      </div>

      <div class="add-box">
        <h4>Note Down a Memory 💭</h4>
        <div class="input-row">
          <input type="text" id="mem-date" placeholder="Date (e.g. Sept 2026)" />
          <input type="text" id="mem-title" placeholder="Title of this moment..." />
        </div>
        <textarea id="mem-text" rows="2" placeholder="Tell the story of what happened..."></textarea>
        <button class="btn-cute" onclick="saveMemory()">Save Memory 💖</button>
      </div>

      <div class="memory-list" id="memories-container"></div>
    </section>

    <!-- SECTION 3: GOALS -->
    <section id="goals-sec">
      <div class="section-header">
        <h2>Goals & Aspirations 🌟</h2>
      </div>

      <div class="add-box">
        <h4>Set a New Goal 🎯</h4>
        <div class="input-row">
          <select id="goal-cat">
            <option value="Academic 📚">Academic 📚</option>
            <option value="Personal 🌸">Personal 🌸</option>
            <option value="Creative 🎨">Creative 🎨</option>
            <option value="Career 💼">Career 💼</option>
          </select>
          <input type="text" id="goal-text" placeholder="What dream are you chasing next?" />
        </div>
        <button class="btn-cute" onclick="saveGoal()">Add Goal 💫</button>
      </div>

      <div class="goals-grid" id="goals-container"></div>
    </section>

    <footer>
      <p>Made with love & pretty dreams 🌸 &bull; Faizatu's Journal</p>
    </footer>
  </div>

  <script>
    const DB_NAME = "FaizatuPinkCornerDB";
    const DB_VERSION = 3;
    let db;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("media")) d.createObjectStore("media", { keyPath: "id" });
          if (!d.objectStoreNames.contains("memories")) d.createObjectStore("memories", { keyPath: "id" });
          if (!d.objectStoreNames.contains("goals")) d.createObjectStore("goals", { keyPath: "id" });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll(store) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    function dbPut(store, item) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).put(item);
        tx.oncomplete = () => res();
      });
    }

    function dbDelete(store, id) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).delete(id);
        tx.oncomplete = () => res();
      });
    }

    function dbClear(store) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).clear();
        tx.oncomplete = () => res();
      });
    }

    // Media Upload Logic
    let currentFile = null;

    function handleSelect(input) {
      if (input.files && input.files[0]) {
        currentFile = input.files[0];
        document.getElementById('file-label').textContent = currentFile.name;
      }
    }

    async function saveMedia() {
      const caption = document.getElementById('caption-input').value.trim() || 'Cozy moment 🌸';
      const status = document.getElementById('status-msg');

      if (!currentFile) {
        alert("Please pick an image or video first! 🎀");
        return;
      }

      let fileToStore = currentFile;
      const fileName = currentFile.name.toLowerCase();
      const isVideo = currentFile.type.startsWith("video/") || fileName.endsWith(".mov") || fileName.endsWith(".mp4");

      // Auto convert iPhone HEIC photos
      if (fileName.endsWith(".heic") || currentFile.type === "image/heic") {
        status.textContent = "Processing iPhone photo... ✨";
        try {
          if (typeof heic2any !== "undefined") {
            const converted = await heic2any({ blob: currentFile, toType: "image/jpeg", quality: 0.9 });
            fileToStore = Array.isArray(converted) ? converted[0] : converted;
          }
        } catch (err) {
          console.error("HEIC error: ", err);
        }
      }

      status.textContent = "Adding to journal... 🌸";

      await dbPut("media", {
        id: Date.now(),
        type: isVideo ? "video" : "image",
        blob: fileToStore,
        caption: caption,
        date: new Date().toLocaleDateString()
      });

      currentFile = null;
      document.getElementById('media-input').value = "";
      document.getElementById('file-label').textContent = "No file chosen";
      document.getElementById('caption-input').value = "";
      status.textContent = "";

      loadMedia();
    }

    async function loadMedia() {
      const list = await dbGetAll("media");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('media-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem; font-weight:600; text-align:center; padding:1.5rem;">No pictures or videos added yet! Tap 'Pick Media' above 🌸</p>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const url = URL.createObjectURL(item.blob);
        const mediaElem = item.type === "video" 
          ? `<video src="${url}" controls playsinline webkit-playsinline preload="metadata"></video>` 
          : `<img src="${url}" alt="${item.caption}" loading="lazy" />`;

        return `
          <div class="photo-card">
            <button class="delete-btn" onclick="removeMedia(${item.id})">✕</button>
            <div class="media-frame">${mediaElem}</div>
            <div class="photo-info">
              <h4>${item.caption}</h4>
              <p>${item.date} &bull; ${item.type === 'video' ? 'Video Clip 🎥' : 'Snapshot 📸'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    async function removeMedia(id) {
      await dbDelete("media", id);
      loadMedia();
    }

    async function clearAllMedia() {
      if (confirm("Do you want to clear your uploaded media?")) {
        await dbClear("media");
        loadMedia();
      }
    }

    // Memories
    async function saveMemory() {
      const date = document.getElementById('mem-date').value.trim() || new Date().toLocaleDateString();
      const title = document.getElementById('mem-title').value.trim();
      const text = document.getElementById('mem-text').value.trim();

      if (!title || !text) {
        alert("Please write a title and memory description! 💕");
        return;
      }

      await dbPut("memories", { id: Date.now(), date, title, text });
      document.getElementById('mem-date').value = "";
      document.getElementById('mem-title').value = "";
      document.getElementById('mem-text').value = "";
      loadMemories();
    }

    async function loadMemories() {
      const list = await dbGetAll("memories");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('memories-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem; font-weight:600; text-align:center; padding:1.5rem;">No memories recorded yet. What made you smile recently? 💭</p>`;
        return;
      }

      container.innerHTML = list.map(m => `
        <div class="memory-item">
          <div>
            <span style="font-family:'Fredoka'; font-size:0.75rem; color:var(--pink-hover); text-transform:uppercase;">${m.date}</span>
            <h4 style="font-family:'Fredoka'; font-size:1.15rem; color:var(--text-main); margin-top:0.1rem;">${m.title}</h4>
            <p style="color:var(--text-muted); font-size:0.95rem; font-weight:600; margin-top:0.3rem;">${m.text}</p>
          </div>
          <button onclick="removeMemory(${m.id})" style="border:none; background:none; cursor:pointer; color:#ff8fa3; font-size:1.1rem; font-weight:bold;">✕</button>
        </div>
      `).join('');
    }

    async function removeMemory(id) {
      await dbDelete("memories", id);
      loadMemories();
    }

    // Goals
    async function saveGoal() {
      const cat = document.getElementById('goal-cat').value;
      const text = document.getElementById('goal-text').value.trim();

      if (!text) {
        alert("Please enter a goal! 🌷");
        return;
      }

      await dbPut("goals", { id: Date.now(), category: cat, text, done: false });
      document.getElementById('goal-text').value = "";
      loadGoals();
    }

    async function toggleGoal(id, currentDone) {
      const list = await dbGetAll("goals");
      const goal = list.find(g => g.id === id);
      if (goal) {
        goal.done = !currentDone;
        await dbPut("goals", goal);
        loadGoals();
      }
    }

    async function removeGoal(id) {
      await dbDelete("goals", id);
      loadGoals();
    }

    async function loadGoals() {
      const list = await dbGetAll("goals");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('goals-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size:0.95rem; font-weight:600; text-align:center; padding:1.5rem;">No goals added yet. Dream big! ✨</p>`;
        return;
      }

      container.innerHTML = list.map(g => `
        <div class="goal-card">
          <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleGoal(${g.id}, ${g.done})">
          <div style="flex:1;" class="${g.done ? 'completed' : ''}">
            <span class="goal-tag">${g.category}</span>
            <p style="font-weight:600; font-size:0.95rem;">${g.text}</p>
          </div>
          <button onclick="removeGoal(${g.id})" style="border:none; background:none; cursor:pointer; color:#ff8fa3; font-size:1rem; font-weight:bold;">✕</button>
        </div>
      `).join('');
    }

    // Tabs
    function filterTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const isAll = tab === 'all';
      document.getElementById('photos-sec').style.display = (isAll || tab === 'photos') ? 'block' : 'none';
      document.getElementById('memories-sec').style.display = (isAll || tab === 'memories') ? 'block' : 'none';
      document.getElementById('goals-sec').style.display = (isAll || tab === 'goals') ? 'block' : 'none';
    }

    // Initialize
    openDatabase().then(() => {
      loadMedia();
      loadMemories();
      loadGoals();
    });
  </script>
</body>
</html>
