<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Faizatu's Cozy Corner 🌸✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
  <!-- PWA & Mobile App Settings -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Faizatu's Space" />
  <meta name="theme-color" content="#fff5f8" />

  <!-- App Icon on your iPhone Home Screen -->
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/cherry-blossom.png" />
  <style>
    :root {
      --bg: #fff5f8;
      --pink-soft: #ffe5ec;
      --pink-primary: #ff758f;
      --pink-hover: #ff4d6d;
      --pink-deep: #a4133c;
      --text-main: #3d232c;
      --text-muted: #8a6c76;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      background-color: var(--bg);
      font-family: 'Quicksand', sans-serif;
      color: var(--text-main);
    }

  body {
      display: flex;
      flex-direction: column;
      /* Perfectly fits bottom bar + safe area home bar without unnecessary extra scrolling */
      padding-bottom: calc(65px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

  /* Fixed Clean App Top Header with iPhone Notch / Island padding */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1.5px solid #ffd6e0;
      /* Adds safe padding so the Dynamic Island / Notch never touches the title */
      padding-top: max(0.8rem, env(safe-area-inset-top));
      padding-bottom: 0.7rem;
      padding-left: 1rem;
      padding-right: 1rem;
      text-align: center;
    }

    .app-header h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.35rem;
      color: var(--pink-hover);
      letter-spacing: -0.3px;
    }

    .app-header p {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Main Container */
    .app-content {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 0.85rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    /* Native Bottom Navigation Bar */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(62px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1.5px solid #ffd6e0;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.15rem;
      background: none;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      flex: 1;
      height: 100%;
      transition: color 0.15s ease;
    }

    .nav-item .icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .nav-item.active {
      color: var(--pink-primary);
    }

    .nav-item.active .icon {
      transform: scale(1.15);
      transition: transform 0.15s ease;
    }

    /* Card Panels */
    .app-card {
      background: #ffffff;
      border-radius: var(--radius);
      border: 1.5px solid #ffe5ec;
      padding: 1.1rem;
      box-shadow: 0 4px 16px rgba(255, 117, 143, 0.08);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .section-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.15rem;
      color: var(--pink-deep);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.2rem;
    }

    /* Mobile Form Inputs */
    input[type="text"], textarea, select {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border-radius: 14px;
      border: 1.5px solid #ffd6e0;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      background: #fff;
      outline: none;
      color: var(--text-main);
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--pink-primary);
    }

    .btn-cute {
      background: linear-gradient(135deg, #ff758f 0%, #ff4d6d 100%);
      color: #fff;
      padding: 0.8rem;
      border-radius: 9999px;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 12px rgba(255, 77, 109, 0.25);
    }

    .btn-upload {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.75rem;
      border-radius: 14px;
      border: 1.5px dashed var(--pink-primary);
      background: #fff8fa;
      color: var(--pink-hover);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .btn-clear {
      background: #fff0f3;
      border: 1px solid #ffd6e0;
      color: var(--pink-deep);
      font-family: 'Fredoka', sans-serif;
      font-size: 0.75rem;
      padding: 0.3rem 0.7rem;
      border-radius: 9999px;
      cursor: pointer;
    }

    /* SCROLLABLE FEED (INSTAGRAM/APP STYLE) */
    .gallery-feed {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      width: 100%;
    }

    .media-card {
      background: #ffffff;
      border-radius: 20px;
      overflow: hidden;
      border: 1.5px solid #ffe5ec;
      box-shadow: 0 6px 18px rgba(255, 117, 143, 0.1);
      position: relative;
    }

    /* Full picture containment - never crops heads or sides */
    .media-display {
      width: 100%;
      background: #140d10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 240px;
      max-height: 480px;
    }

    .media-card img {
      width: 100%;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      display: block;
    }

    .media-card video {
      width: 100%;
      max-height: 480px;
      display: block;
      background: #000;
    }

    .media-card-info {
      padding: 0.85rem 1rem;
      background: #fff;
    }

    .media-card-info h4 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1rem;
      color: var(--pink-deep);
      margin-bottom: 0.15rem;
    }

    .media-card-info p {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .del-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255, 255, 255, 0.9);
      color: var(--pink-deep);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      z-index: 2;
    }

    /* Memories & Goals */
    .mem-item {
      background: #fff;
      border-left: 4px solid var(--pink-primary);
      padding: 0.9rem 1rem;
      border-radius: 0 16px 16px 0;
      border-top: 1px solid #ffe5ec;
      border-right: 1px solid #ffe5ec;
      border-bottom: 1px solid #ffe5ec;
      margin-bottom: 0.75rem;
      display: flex;
      justify-content: space-between;
      gap: 0.7rem;
    }

    .goal-row {
      background: #fff;
      padding: 0.85rem 1rem;
      border-radius: 16px;
      border: 1.5px solid #ffe5ec;
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .goal-row input[type="checkbox"] {
      margin-top: 0.15rem;
      width: 18px;
      height: 18px;
      accent-color: var(--pink-primary);
    }

    .goal-badge {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.7rem;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      background: var(--pink-soft);
      color: var(--pink-deep);
      font-weight: 600;
    }

    .done-text {
      text-decoration: line-through;
      color: #bfaab2;
    }
  </style>
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <h1>Faizatu's Space 🌸</h1>
    <p>Snapshots, memories & little dreams ✨</p>
  </header>

  <!-- App Content Container -->
  <main class="app-content">

    <!-- VIEW 1: SCROLLABLE GALLERY FEED (DEFAULT VIEW) -->
    <section id="view-gallery">
      <div class="section-title">
        <span>Gallery 🖼️</span>
        <button class="btn-clear" onclick="clearAllMedia()">Clear All</button>
      </div>
      <div class="gallery-feed" id="feed-container"></div>
    </section>

    <!-- VIEW 2: POST / UPLOAD MEDIA -->
    <section id="view-upload" style="display:none;">
      <div class="app-card">
        <div class="section-title">Post Snapshot or Video 📸</div>
        
        <label class="btn-upload">
          🎀 Pick from iPhone Library
          <input type="file" id="media-input" accept="image/*,video/*,.heic,.HEIC,.mov,.mp4" style="display:none;" onchange="handleSelect(this)">
        </label>
        
        <div id="file-name-label" style="font-size:0.8rem; font-weight:600; color:var(--text-muted); text-align:center;">No photo or video chosen</div>
        <input type="text" id="caption-input" placeholder="Write a cute caption..." />
        <div id="status-msg" style="font-size:0.82rem; font-weight:700; color:var(--pink-hover); text-align:center;"></div>
        <button class="btn-cute" onclick="saveMedia()">Add to Gallery ✨</button>
      </div>
    </section>

    <!-- VIEW 3: MEMORIES -->
    <section id="view-memories" style="display:none;">
      <div class="app-card" style="margin-bottom:1rem;">
        <div class="section-title">Save a Memory 💌</div>
        <input type="text" id="mem-date" placeholder="Date (e.g. Sept 2026)" />
        <input type="text" id="mem-title" placeholder="Memory Title..." />
        <textarea id="mem-text" rows="2" placeholder="What happened today?"></textarea>
        <button class="btn-cute" onclick="saveMemory()">Save Moment 💖</button>
      </div>
      <div id="memories-container"></div>
    </section>

    <!-- VIEW 4: GOALS -->
    <section id="view-goals" style="display:none;">
      <div class="app-card" style="margin-bottom:1rem;">
        <div class="section-title">New Dream 🎯</div>
        <select id="goal-cat">
          <option value="Academic 📚">Academic 📚</option>
          <option value="Personal 🌸">Personal 🌸</option>
          <option value="Creative 🎨">Creative 🎨</option>
          <option value="Career 💼">Career 💼</option>
        </select>
        <input type="text" id="goal-text" placeholder="What are you chasing?" />
        <button class="btn-cute" onclick="saveGoal()">Add Goal 💫</button>
      </div>
      <div id="goals-container"></div>
    </section>

  </main>

  <!-- Mobile App Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchView('gallery', this)">
      <span class="icon">🖼️</span>
      <span>Gallery</span>
    </button>
    <button class="nav-item" onclick="switchView('upload', this)">
      <span class="icon">➕</span>
      <span>Post</span>
    </button>
    <button class="nav-item" onclick="switchView('memories', this)">
      <span class="icon">💌</span>
      <span>Memories</span>
    </button>
    <button class="nav-item" onclick="switchView('goals', this)">
      <span class="icon">🌷</span>
      <span>Goals</span>
    </button>
  </nav>

  <script>
    const DB_NAME = "FaizatuPinkCornerDB";
    const DB_VERSION = 3;
    let db;

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const d = e.target.result;
          if (!d.objectStoreNames.contains("media")) d.createObjectStore("media", { keyPath: "id" });
          if (!d.objectStoreNames.contains("memories")) d.createObjectStore("memories", { keyPath: "id" });
          if (!d.objectStoreNames.contains("goals")) d.createObjectStore("goals", { keyPath: "id" });
        };
        req.onsuccess = () => { db = req.result; resolve(); };
        req.onerror = () => reject(req.error);
      });
    }

    function dbGetAll(store) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readonly");
        const req = tx.objectStore(store).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res([]);
      });
    }

    function dbPut(store, item) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).put(item);
        tx.oncomplete = () => res();
      });
    }

    function dbDelete(store, id) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).delete(id);
        tx.oncomplete = () => res();
      });
    }

    function dbClear(store) {
      return new Promise((res) => {
        const tx = db.transaction(store, "readwrite");
        tx.objectStore(store).clear();
        tx.oncomplete = () => res();
      });
    }

    // Tab switcher
    function switchView(tabName, btn) {
      document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      document.getElementById('view-gallery').style.display = tabName === 'gallery' ? 'block' : 'none';
      document.getElementById('view-upload').style.display = tabName === 'upload' ? 'block' : 'none';
      document.getElementById('view-memories').style.display = tabName === 'memories' ? 'block' : 'none';
      document.getElementById('view-goals').style.display = tabName === 'goals' ? 'block' : 'none';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Media Logic
    let currentFile = null;

    function handleSelect(input) {
      if (input.files && input.files[0]) {
        currentFile = input.files[0];
        document.getElementById('file-name-label').textContent = currentFile.name;
      }
    }

    async function saveMedia() {
      const caption = document.getElementById('caption-input').value.trim() || 'Cozy moment 🌸';
      const status = document.getElementById('status-msg');

      if (!currentFile) {
        alert("Please pick an image or video first! 🎀");
        return;
      }

      let fileToStore = currentFile;
      const fileName = currentFile.name.toLowerCase();
      const isVideo = currentFile.type.startsWith("video/") || fileName.endsWith(".mov") || fileName.endsWith(".mp4");

      // Auto convert HEIC
      if (fileName.endsWith(".heic") || currentFile.type === "image/heic") {
        status.textContent = "Processing iPhone photo... ✨";
        try {
          if (typeof heic2any !== "undefined") {
            const converted = await heic2any({ blob: currentFile, toType: "image/jpeg", quality: 0.9 });
            fileToStore = Array.isArray(converted) ? converted[0] : converted;
          }
        } catch (err) {
          console.error("HEIC error: ", err);
        }
      }

      status.textContent = "Adding to feed... 🌸";

      await dbPut("media", {
        id: Date.now(),
        type: isVideo ? "video" : "image",
        blob: fileToStore,
        caption: caption,
        date: new Date().toLocaleDateString()
      });

      currentFile = null;
      document.getElementById('media-input').value = "";
      document.getElementById('file-name-label').textContent = "No photo or video chosen";
      document.getElementById('caption-input').value = "";
      status.textContent = "";

      // Move user directly to gallery feed
      switchView('gallery', document.querySelectorAll('.nav-item')[0]);
      loadMedia();
    }

    async function loadMedia() {
      const list = await dbGetAll("media");
      list.sort((a, b) => b.id - a.id);
      const feed = document.getElementById('feed-container');

      if (list.length === 0) {
        feed.innerHTML = `
          <div style="text-align:center; padding: 2.5rem 1rem; color:var(--text-muted);">
            <p style="font-weight:600; font-size:1rem;">Your gallery is empty! 🌸</p>
            <p style="font-size:0.82rem; margin-top:0.3rem;">Tap the <b>➕ Post</b> button below to upload your pictures and videos.</p>
          </div>
        `;
        return;
      }

      feed.innerHTML = list.map(item => {
        const url = URL.createObjectURL(item.blob);
        const mediaTag = item.type === "video"
          ? `<video src="${url}" controls playsinline webkit-playsinline preload="metadata"></video>`
          : `<img src="${url}" alt="${item.caption}" loading="lazy" />`;

        return `
          <div class="media-card">
            <button class="del-btn" onclick="removeMedia(${item.id})">✕</button>
            <div class="media-display">${mediaTag}</div>
            <div class="media-card-info">
              <h4>${item.caption}</h4>
              <p>${item.date} &bull; ${item.type === 'video' ? 'Video 🎥' : 'Photo 📸'}</p>
            </div>
          </div>
        `;
      }).join('');
    }

    async function removeMedia(id) {
      await dbDelete("media", id);
      loadMedia();
    }

    async function clearAllMedia() {
      if (confirm("Clear all items from your gallery?")) {
        await dbClear("media");
        loadMedia();
      }
    }

    // Memories
    async function saveMemory() {
      const date = document.getElementById('mem-date').value.trim() || new Date().toLocaleDateString();
      const title = document.getElementById('mem-title').value.trim();
      const text = document.getElementById('mem-text').value.trim();

      if (!title || !text) {
        alert("Please write a title and memory description! 💕");
        return;
      }

      await dbPut("memories", { id: Date.now(), date, title, text });
      document.getElementById('mem-date').value = "";
      document.getElementById('mem-title').value = "";
      document.getElementById('mem-text').value = "";
      loadMemories();
    }

    async function loadMemories() {
      const list = await dbGetAll("memories");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('memories-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; font-weight:600; padding:1rem;">No memories written down yet 💭</p>`;
        return;
      }

      container.innerHTML = list.map(m => `
        <div class="mem-item">
          <div>
            <span style="font-family:'Fredoka'; font-size:0.7rem; color:var(--pink-hover);">${m.date}</span>
            <h4 style="font-family:'Fredoka'; font-size:0.98rem; color:var(--text-main); margin-top:0.1rem;">${m.title}</h4>
            <p style="color:var(--text-muted); font-size:0.85rem; font-weight:600; margin-top:0.2rem;">${m.text}</p>
          </div>
          <button onclick="removeMemory(${m.id})" style="border:none; background:none; cursor:pointer; color:#ff8fa3; font-size:1rem; font-weight:bold;">✕</button>
        </div>
      `).join('');
    }

    async function removeMemory(id) {
      await dbDelete("memories", id);
      loadMemories();
    }

    // Goals
    async function saveGoal() {
      const cat = document.getElementById('goal-cat').value;
      const text = document.getElementById('goal-text').value.trim();

      if (!text) {
        alert("Please type out your goal! 🌷");
        return;
      }

      await dbPut("goals", { id: Date.now(), category: cat, text, done: false });
      document.getElementById('goal-text').value = "";
      loadGoals();
    }

    async function toggleGoal(id, currentDone) {
      const list = await dbGetAll("goals");
      const goal = list.find(g => g.id === id);
      if (goal) {
        goal.done = !currentDone;
        await dbPut("goals", goal);
        loadGoals();
      }
    }

    async function removeGoal(id) {
      await dbDelete("goals", id);
      loadGoals();
    }

    async function loadGoals() {
      const list = await dbGetAll("goals");
      list.sort((a, b) => b.id - a.id);
      const container = document.getElementById('goals-container');

      if (list.length === 0) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; font-weight:600; padding:1rem;">No goals added yet ✨</p>`;
        return;
      }

      container.innerHTML = list.map(g => `
        <div class="goal-row">
          <input type="checkbox" ${g.done ? 'checked' : ''} onchange="toggleGoal(${g.id}, ${g.done})">
          <div style="flex:1;">
            <span class="goal-badge">${g.category}</span>
            <p class="${g.done ? 'done-text' : ''}" style="font-weight:600; font-size:0.86rem; margin-top:0.25rem;">${g.text}</p>
          </div>
          <button onclick="removeGoal(${g.id})" style="border:none; background:none; cursor:pointer; color:#ff8fa3; font-size:0.95rem; font-weight:bold;">✕</button>
        </div>
      `).join('');
    }

    // Init
    openDatabase().then(() => {
      loadMedia();
      loadMemories();
      loadGoals();
    });
  </script>
</body>
</html>
